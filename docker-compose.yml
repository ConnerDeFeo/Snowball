services:
  review-pipeline:
    build:
      context: ./review-pipeline
      dockerfile: dockerfile
    environment:
      - AWS_DEFAULT_REGION=us-east-2
    volumes:
      - ~/.aws:/root/.aws:ro
  analysis-pipeline:
    build:
      context: ./analysis-pipeline
      dockerfile: dockerfile
    secrets:
      - EDGAR_IDENTITY
    environment:
      - AWS_DEFAULT_REGION=us-east-2
    volumes:
      - ~/.aws:/root/.aws:ro

  orchestrator:
    build:
      context: ./orchestrator
      dockerfile: dockerfile
    ports:
      - "8080:8080"
    environment:
      ANALYSIS_PIPELINE_URL: "http://analysis-pipeline:8000"
      REVIEW_PIPELINE_URL: "http://review-pipeline:8000"
    depends_on:
      - analysis-pipeline
      - review-pipeline

secrets:
  EDGAR_IDENTITY:
    file: ./secrets/EDGAR_IDENTITY.txt
