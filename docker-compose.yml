services:
  localstack:
    image: localstack/localstack:4.4.0
    ports:
      - "4566:4566"
    environment:
      - SERVICES=dynamodb,s3
    volumes:
      - ./localstack-init:/etc/localstack/init/ready.d

  review-pipeline:
    build:
      context: ./review-pipeline
      dockerfile: dockerfile
    environment:
      - AWS_ENDPOINT_URL=http://localstack:4566
    volumes:
      - ~/.aws:/root/.aws:ro
    depends_on:
      - localstack

  analysis-pipeline:
    build:
      context: ./analysis-pipeline
      dockerfile: dockerfile
    secrets:
      - EDGAR_IDENTITY
    environment:
      - AWS_ENDPOINT_URL=http://localstack:4566
    volumes:
      - ~/.aws:/root/.aws:ro
    depends_on:
      - localstack

  orchestrator:
    build:
      context: ./orchestrator
      dockerfile: dockerfile
    ports:
      - "8080:8080"
    environment:
      ANALYSIS_PIPELINE_URL: "http://analysis-pipeline:8000"
      REVIEW_PIPELINE_URL: "http://review-pipeline:8000"
    depends_on:
      - analysis-pipeline
      - review-pipeline

secrets:
  EDGAR_IDENTITY:
    file: ./secrets/EDGAR_IDENTITY.txt
