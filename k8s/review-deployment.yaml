apiVersion: apps/v1
kind: Deployment
metadata:
  name: review-pipeline
spec:
  replicas: 1
  selector:
    matchLabels:
      app: review-pipeline
  template:
    metadata:
      labels:
        app: review-pipeline
    spec:
      serviceAccountName: review-pipeline
      containers:
        - name: review-pipeline
          image: 857360184083.dkr.ecr.us-east-2.amazonaws.com/snowball/review-pipeline:bd0f9ad
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: AWS_DEFAULT_REGION
              value: us-east-2